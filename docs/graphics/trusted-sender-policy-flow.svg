<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">SENTRI trusted sender policy flow</title>
  <desc id="desc">An administrator approves an exact sender address in Deployment. The company policy is stored under its company ID. Dispatch displays the address as a trusted contact. Protocol checks the sender and Gmail authentication. A passing exact match receives a Safe policy label; otherwise the email continues to AI analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#191e1a"/><stop offset="1" stop-color="#262e26"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#303b30"/><stop offset="1" stop-color="#252e26"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a9b69c" stroke-opacity=".06"/></pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="11" stdDeviation="16" flood-color="#070b06" flood-opacity=".33"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto"><path d="M2 2L9 6L2 10" fill="none" stroke="#c7d5ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .mono{font-family:"SFMono-Regular",Menlo,Consolas,monospace}
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .heading{fill:#e9ecdf;font-weight:700}
      .muted{fill:#aebaa8}
      .accent{fill:#c7d5ab}
    </style>
  </defs>
  <rect width="1600" height="1280" fill="url(#bg)"/><rect width="1600" height="1280" fill="url(#grid)"/>
  <rect x="42" y="42" width="1516" height="1196" fill="none" stroke="#566450" stroke-width="2"/>
  <rect x="54" y="54" width="1492" height="1172" fill="none" stroke="#566450" stroke-opacity=".55"/>
  <rect x="92" y="83" width="56" height="56" rx="10" fill="#c7d5ab"/>
  <text x="120" y="120" text-anchor="middle" class="mono" fill="#1b241b" font-size="30" font-weight="700">S</text>
  <text x="171" y="109" class="mono heading" font-size="25" letter-spacing="4">TRUSTED SENDER POLICY</text>
  <text x="171" y="136" class="mono muted" font-size="14" letter-spacing="2">COMPANY-WIDE FLOW</text>
  <text x="1494" y="111" text-anchor="end" class="mono accent" font-size="14" letter-spacing="2">TARGET ARCHITECTURE</text>

  <g filter="url(#shadow)">
    <rect x="485" y="185" width="630" height="143" rx="18" fill="url(#card)" stroke="#c7d5ab" stroke-width="2.5"/>
    <text x="800" y="231" text-anchor="middle" class="mono accent" font-size="17" letter-spacing="2">01 · DEPLOYMENT</text>
    <text x="800" y="279" text-anchor="middle" class="sans heading" font-size="29">Admin approves an exact email address</text>
  </g>
  <path d="M800 328V376" fill="none" stroke="#c7d5ab" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="430" y="395" width="740" height="132" rx="17" fill="#222c23" stroke="#83977c" stroke-width="2"/>
    <text x="800" y="442" text-anchor="middle" class="mono accent" font-size="17" letter-spacing="2">02 · SHARED COMPANY POLICY</text>
    <text x="800" y="490" text-anchor="middle" class="sans heading" font-size="27">Stored under the company ID</text>
  </g>

  <path d="M800 527V588H410V630" fill="none" stroke="#c7d5ab" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M800 588H1190V630" fill="none" stroke="#c7d5ab" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="800" cy="588" r="7" fill="#c7d5ab"/>
  <g filter="url(#shadow)">
    <rect x="105" y="650" width="610" height="147" rx="18" fill="url(#card)" stroke="#788c74" stroke-width="2.5"/>
    <text x="410" y="699" text-anchor="middle" class="mono accent" font-size="17" letter-spacing="2">03 · DISPATCH</text>
    <text x="410" y="748" text-anchor="middle" class="sans heading" font-size="26">Shows the trusted contact</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="885" y="650" width="610" height="147" rx="18" fill="url(#card)" stroke="#788c74" stroke-width="2.5"/>
    <text x="1190" y="699" text-anchor="middle" class="mono accent" font-size="17" letter-spacing="2">04 · PROTOCOL</text>
    <text x="1190" y="748" text-anchor="middle" class="sans heading" font-size="26">Checks the sender</text>
  </g>

  <path d="M1190 797V830" fill="none" stroke="#c7d5ab" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1190 850L1380 948L1190 1046L1000 948Z" fill="#293529" stroke="#c7d5ab" stroke-width="3" filter="url(#shadow)"/>
  <text x="1190" y="936" text-anchor="middle" class="sans heading" font-size="24">Exact match + Gmail</text>
  <text x="1190" y="969" text-anchor="middle" class="sans heading" font-size="24">authentication pass?</text>

  <path d="M1000 948H804V1090" fill="none" stroke="#c7d5ab" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1380 948H1440V1090" fill="none" stroke="#c7d5ab" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="852" y="912" width="82" height="34" rx="6" fill="#c7d5ab"/>
  <text x="893" y="936" text-anchor="middle" class="mono" fill="#1b241b" font-size="17" font-weight="700">YES</text>
  <rect x="1405" y="911" width="76" height="34" rx="6" fill="#d8c499"/>
  <text x="1443" y="935" text-anchor="middle" class="mono" fill="#29251b" font-size="17" font-weight="700">NO</text>

  <g filter="url(#shadow)">
    <rect x="550" y="1110" width="505" height="106" rx="16" fill="#2c3e2d" stroke="#a3c29b" stroke-width="2.5"/>
    <text x="802" y="1158" text-anchor="middle" class="sans heading" font-size="28">Safe policy label</text>
    <text x="802" y="1191" text-anchor="middle" class="sans muted" font-size="18">AI scan skipped</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1210" y="1110" width="330" height="106" rx="16" fill="#3b3529" stroke="#c5ac7b" stroke-width="2.5"/>
    <text x="1375" y="1155" text-anchor="middle" class="sans heading" font-size="23">Continue email</text>
    <text x="1375" y="1188" text-anchor="middle" class="sans heading" font-size="23">analysis</text>
  </g>
</svg>
